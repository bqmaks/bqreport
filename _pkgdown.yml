url: https://bqmaks.github.io/bqreport/

template:
  bootstrap: 5
  bootswatch: flatly
  bslib:
    primary: "#2B6CB0"
    base_font: system-ui
    heading_font: system-ui
    code_font: monospace

home:
  title: Metadata-aware biomedical analysis
  description: >
    Inspectable analysis plans, validated statistical engines, tidy numerical
    results, and publication-ready reporting for biomedical data.

navbar:
  structure:
    left: [intro, articles, reference, examples, news]
    right: [search, github]
  components:
    intro:
      text: Get started
      href: articles/get-started.html
    articles:
      text: Workflows
      menu:
        - text: Descriptive analysis
          href: articles/descriptive-analysis.html
        - text: Models and contrasts
          href: articles/models-and-contrasts.html
        - text: Correlation analysis
          href: articles/correlation-analysis.html
        - text: Longitudinal and survival
          href: articles/longitudinal-survival.html
        - text: Custom functions and engines
          href: articles/custom-functions.html
    examples:
      text: Examples
      href: articles/examples-gallery.html

articles:
  - title: Start here
    navbar: ~
    contents:
      - get-started
      - examples-gallery
  - title: Analysis workflows
    contents:
      - descriptive-analysis
      - models-and-contrasts
      - correlation-analysis
      - longitudinal-survival
  - title: Extending bqreport
    contents:
      - custom-functions

reference:
  - title: Data and metadata
    desc: Create bq_data and configure variable semantics.
    contents:
      - as_bq_data
      - apply_dictionary
      - variables
      - outcomes
      - designs
      - contrasts
      - set_role
      - remove_role
      - set_outcome
      - set_predictor
      - set_coding
      - set_descriptive_statistics
      - set_colors
      - variable_colors
      - set_transformation
      - transformation_function
      - set_model_term
      - natural_spline
      - polynomial_term
      - per
      - set_weight
      - set_cluster
  - title: Selectors and planning
    desc: Select metadata-aware variables and compile inspectable plans.
    contents:
      - starts_with("all_")
      - starts_with("where_")
      - analysis_rules
      - plan_analysis
      - validate_plan
      - approve_plan
      - run_analysis
  - title: Descriptive analysis
    contents:
      - plan_descriptives
      - descriptive_function
      - shapiro_wilk
      - group_comparison_function
      - group_comparison_output
      - mean_difference
      - standardized_mean_difference
      - risk_difference
      - risk_ratio
      - odds_ratio
  - title: Models and contrasts
    contents:
      - linear_model
      - logistic_model
      - poisson_model
      - negative_binomial_model
      - ordinal_logistic_model
      - multinomial_logistic_model
      - firth_logistic
      - separation_logistic
      - set_comparisons
      - against_reference
      - all_pairwise
      - consecutive_comparisons
      - against_global_mean
      - within_levels
      - contrast_of_contrasts
      - comparison_function
  - title: Correlations
    contents:
      - plan_correlations
      - pearson_correlation
      - weighted_pearson_correlation
      - repeated_measures_correlation
      - biweight_correlation
      - resampled_correlation
      - correlation_method
      - correlation_output
      - correlation_comparator
      - correlation_comparison_output
  - title: Longitudinal analysis
    contents:
      - set_longitudinal_design
      - add_longitudinal_outcome
      - plan_longitudinal
      - lmm_model
      - glmm_model
      - gee_model
      - binary_gee_model
  - title: Survival and competing risks
