  - title: Custom engines and selection
    contents:
      - analysis_function
      - analysis_method
      - analysis_output
      - method_selector
      - method_choice
  - title: Results and reporting
    contents:
      - estimates
      - tests
      - diagnostics
      - issues
      - models
      - descriptives
      - survival_estimates
      - correlations
      - omnibus_effects
      - tbl_descriptive
      - tbl_regression
      - tbl_comparison
      - tbl_correlation
      - tbl_survival
      - tbl_longitudinal
      - table_body
